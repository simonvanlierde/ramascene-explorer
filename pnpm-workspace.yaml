# Install no package version younger than 7 days (in minutes), as Renovate
# already waits, so a manual `pnpm add` cannot pull a release published hours ago.
minimumReleaseAge: 10080
overrides:
  # typed-rest-client (via Stryker) pins qs 6.15.1, which has three advisories
  # (GHSA-4mjr-xmp4-gh2g, GHSA-q8mj-m7cp-5q26, GHSA-x5fp-wj9c-mxmx). Drop once it moves.
  qs: ">=6.16.0"
  # wrangler 4.149.0 > miniflare pins undici 7.29.1, which has eight advisories fixed in
  # 7.30.1 (it reaches wrangler dev and CI only). Drop once a wrangler that is past the
  # release-age wait ships miniflare with undici >=7.30.1 (wrangler 4.155.0 does).
  undici: "^7.30.1"
# Both packages use binaries from optional dependencies; no install script is needed.
allowBuilds:
  esbuild: false
  workerd: false

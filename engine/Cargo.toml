[package]
name = "ramascene-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The browser scenario maths: the small Woodbury system and the flow fold"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
faer = { version = "0.24", default-features = false, features = ["std", "linalg"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
# The code follows the maths: R, K, C, ΔA, T, W.
many_single_char_names = "allow"
# Matrix sizes are at most 9,800, far below f64's 2^53.
cast_precision_loss = "allow"

# cargo-deny: CI runs `cargo deny check` against this file.

# Vulnerabilities and unmaintained crates fail the check; yanked crates only warn.
[advisories]
ignore = [
  # paste is unmaintained, not vulnerable: a compile-time macro that faer's gemm
  # crates use, with no replacement upstream yet. Drop this once faer moves off it.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time macro under faer, no fix available" },
]

[licenses]
# Permissive licenses only, for dependencies. Add an exception per crate rather
# than widening the list. Once this crate publishes, its own license must be here too.
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
# The list is policy, not an inventory: allowed licenses nothing uses yet are fine.
unused-allowed-license = "allow"

# Crates with `publish = false`, this one included, are not license-checked.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"

# crates.io only: a git dependency or another registry fails the check.
[sources]
unknown-registry = "deny"
unknown-git = "deny"

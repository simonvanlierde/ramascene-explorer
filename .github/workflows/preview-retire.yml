name: retire preview

# Deletes the preview Worker of a pull request that closes or turns draft, and sweeps
# daily for any that were missed (docs/publishing.md#cloudflare).
on:
  pull_request:
    types: [closed, converted_to_draft]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      prs:
        description: Pull request numbers to retire, separated by spaces. Leave empty to run the daily sweep.
        required: false

permissions:
  contents: read

# Shares cloudflare.yml's preview group, so a retire waits for a deploy in flight.
concurrency:
  group: preview-${{ github.event.pull_request.number || github.run_id }}

jobs:
  retire:
    name: retire
    # Bot pull requests never get a preview, so the sweep covers them, and their workflow
    # files never run with the token.
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
        && !endsWith(github.event.pull_request.user.login, '[bot]'))
    runs-on: ubuntu-latest
    environment: cloudflare
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # the sweep reads each pull request's state
      actions: read # the wait below lists this commit's cloudflare.yml runs
    steps:
      # The base branch's script: a closed pull request may have no merge ref left.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      # A pull request merged while its preview check runs would otherwise lose the Worker
      # under that check, which then fails with a 404 on a merged pull request. While this
      # run holds the preview group, a run's preview job cannot start, so only runs whose
      # preview job has completed are waited for; the others would wait for this one.
      - name: wait for the preview's own deploy and check
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 40); do
            busy=0
            for id in $(gh run list -R "$REPO" --workflow cloudflare.yml --commit "$SHA" --json databaseId,status -q '.[] | select(.status != "completed") | .databaseId'); do
              deployed=$(gh run view "$id" -R "$REPO" --json jobs -q '[.jobs[] | select(.name == "preview" and .status == "completed")] | length')
              [ "$deployed" != 0 ] && busy=1
            done
            [ "$busy" = 0 ] && exit 0
            sleep 15
          done
          echo "::warning::cloudflare.yml still runs for $SHA after 10 minutes; retiring the preview anyway"

      # The script is a copy of the project-templates one. It never names the production
      # Worker: it deletes only ramascene-explorer-pr-<number>.
      - name: delete the preview Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SLUG: ramascene-explorer
          PRS: ${{ github.event.pull_request.number || inputs.prs }}
        run: .github/scripts/preview-retire.sh

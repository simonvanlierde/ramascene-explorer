name: ci

# Without the engine or the EXIOBASE matrices: pytest skips the real-engine
# checks unless --engine is given. node --test and Playwright read the synthetic
# fixtures and the shipped results, with the embodied flows downloaded from the
# data-2011 release and checked against their SHA-256.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: precompute tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run pytest --cov=precompute --cov=compare_data
      # The routes need the EXIOBASE arrays; this checks the README table against their committed results.
      - run: uv run python brightway-check/table.py --check

  page:
    name: page tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # hyparquet reads the Parquet files, so the dependencies are installed.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The real-data checks (flows against the engine's totals) need the
      # release asset; with CI set they fail rather than skip without it.
      - name: fetch the embodied flows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download data-2011 --repo "$GITHUB_REPOSITORY" --pattern embodied.parquet --dir data
          sha256sum --check data/embodied.sha256

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm test

  playwright-version:
    name: playwright version
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The browser container's tag must match the Playwright in package.json
      # (pinned exactly), so it is read from there, not kept in sync by hand.
      - id: version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

  browser:
    name: browser and accessibility tests
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The browsers and their system libraries come with the image, so the job needs
    # no apt or browser download. The tag comes from package.json, so no digest can
    # be pinned next to it. The site self-hosts its fonts (@fontsource), so the
    # image needs no extra system font.
    container:
      # jactionlint ignore=unpinned-images
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    # Firefox expects HOME to be the root user's home inside the container.
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The shipped-data test reads the embodied flows from the release, by
      # range request, as the live page does. The image has curl but not gh.
      - name: fetch the embodied flows
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --output data/embodied.parquet \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/data-2011/embodied.parquet"
          sha256sum --check data/embodied.sha256

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright test

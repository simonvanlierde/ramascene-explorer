name: ci

# Without the engine or the EXIOBASE matrices: pytest skips the real-engine
# checks unless --engine is given. node --test and Playwright read the synthetic
# fixtures and the shipped results, with the embodied flows downloaded from the
# data-2011-r2 release and checked against their SHA-256.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: precompute tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - run: uv sync --locked
      - run: uv run ty check
      - run: uv run pytest --cov=precompute --cov=compare_data
      # The routes need the EXIOBASE arrays; this checks the README table against their committed results.
      - run: uv run python brightway-check/table.py --check

  page:
    name: page tests
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # hyparquet reads the Parquet files, so the dependencies are installed.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # The real-data checks (flows against the engine's totals) need the
      # release asset; with CI set they fail rather than skip without it.
      - name: fetch the embodied flows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download data-2011-r2 --repo "$GITHUB_REPOSITORY" --pattern embodied.parquet --dir data
          sha256sum --check data/embodied.sha256

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-pkg
          path: engine
      - name: fetch the browser scenario data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download data-2011 --repo "$GITHUB_REPOSITORY" --pattern ramascene-browser-engine-zarr.tar --dir data
          sha256sum --check data/browser-engine-zarr.sha256
          tar -xf data/ramascene-browser-engine-zarr.tar -C data
      - run: pnpm exec biome ci .
      - run: pnpm test
        env:
          BROWSER_ENGINE_DATA: data/browser-engine
      - run: node brightway-check/browser_check.js data/browser-engine

  engine:
    name: engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Builds engine/pkg too, which the browser job takes: its Playwright image has
      # no C linker for build scripts.
      - uses: ./.github/actions/engine
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.149,cargo-deny@0.20.2
          fallback: none
      - run: cargo fmt --check
      # --locked: the first build fails on a Cargo.lock that is missing or stale. The
      # JavaScript exports compile only for wasm32, so lint there.
      - run: cargo clippy --locked --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo clippy --locked --features threads --all-targets -- -D warnings
      - run: cargo nextest run --locked --features threads
        env:
          RAYON_NUM_THREADS: "4"
      - run: cargo deny check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-pkg
          path: |
            engine/pkg/
            engine/pkg-threads/
          if-no-files-found: error
          retention-days: 1

  playwright-version:
    name: playwright version
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The browser container's tag must match the Playwright in package.json
      # (pinned exactly), so it is read from there, not kept in sync by hand.
      - id: version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

  browser:
    name: browser tests (${{ matrix.engine }})
    needs: [playwright-version, engine]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One job per browser engine, so the slow WebKit projects run beside the others.
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            projects: --project=light --project=dark --project=phone
          - engine: firefox
            projects: --project=firefox
          - engine: webkit
            projects: --project=safari --project=iphone
    # The browsers and their system libraries come with the image, so the job needs
    # no apt or browser download. The tag comes from package.json, so no digest can
    # be pinned next to it. The site self-hosts its fonts (@fontsource), so the
    # image needs no extra system font.
    container:
      # jactionlint ignore=unpinned-images
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    # Firefox expects HOME to be the root user's home inside the container.
    env:
      HOME: /root
    # Container jobs default to sh, which has no pipefail.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # The shipped-data test reads the embodied flows from the release, by
      # range request, as the live page does. The image has curl but not gh.
      - name: fetch the embodied flows
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --output data/embodied.parquet \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/data-2011-r2/embodied.parquet"
          sha256sum --check data/embodied.sha256
          curl -fsSL --retry 3 --output data/ramascene-browser-engine-zarr.tar \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/data-2011/ramascene-browser-engine-zarr.tar"
          sha256sum --check data/browser-engine-zarr.sha256
          tar -xf data/ramascene-browser-engine-zarr.tar -C data

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-pkg
          path: engine
      - run: pnpm build
      - run: pnpm exec playwright test ${{ matrix.projects }}
      # a failure keeps its trace (DOM, console, timing), for failures only CI shows
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.engine }}
          path: test-results/
          retention-days: 7
      # in the shortest shard; check.js drives all three engines itself
      - name: check Cloudflare range reads and isolation
        if: matrix.engine == 'firefox'
        run: |
          set -euo pipefail
          pnpm build:cloudflare
          key=$(node -p '"embodied/" + require("./data/results.json").provenance.embodied.sha256 + ".parquet"')
          pnpm exec wrangler r2 object put "ramascene-explorer-data/$key" --file data/embodied.parquet --local
          node node_modules/wrangler/bin/wrangler.js dev --port 4191 --ip 127.0.0.1 --local > /tmp/cloudflare.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:4191/ramascene-explorer/ > /dev/null; then break; fi
            sleep 1
          done
          node hosting/check.js http://127.0.0.1:4191/ramascene-explorer/ || { cat /tmp/cloudflare.log; exit 1; }

  # The ruleset requires this name; it passes only when every engine passed.
  browser-all:
    name: browser and accessibility tests
    needs: browser
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every engine passed
        env:
          RESULT: ${{ needs.browser.result }}
        run: test "$RESULT" = success

name: ci

# Without the engine or the EXIOBASE matrices: pytest skips the real-engine
# checks unless --engine is given. node --test and Playwright read the synthetic
# fixtures and the shipped results, with the release data fetched and checked
# against its SHA-256 by scripts/fetch-data.sh.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a second merge to main must not cancel the first commit's full run
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: precompute tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - run: uv sync --locked
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
          fallback: none
      # ty, pytest over the coverage floor, and the README table against the routes' committed
      # results (the routes need the EXIOBASE arrays).
      - run: just py

  page:
    name: page tests
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # hyparquet reads the Parquet files, so the dependencies are installed.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # The real-data checks (flows against the engine's totals) need the
      # release assets; with CI set they fail rather than skip without them.
      - uses: ./.github/actions/data

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-pkg
          path: engine
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
          fallback: none
      - run: just page
        env:
          BROWSER_ENGINE_DATA: data/browser-engine

  engine:
    name: engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Builds engine/pkg too, which the browser job takes: its Playwright image has
      # no C linker for build scripts.
      - uses: ./.github/actions/engine
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.149,cargo-deny@0.20.2,just@1.59.0
          fallback: none
      # fmt, clippy for both targets, nextest and cargo deny. --locked: the first build
      # fails on a Cargo.lock that is missing or stale.
      - run: just rust
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-pkg
          path: |
            engine/pkg/
            engine/pkg-threads/
          if-no-files-found: error
          retention-days: 1

  playwright-version:
    name: playwright version
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The browser container's tag must match the Playwright in package.json
      # (pinned exactly), so it is read from there, not kept in sync by hand.
      - id: version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

  browser:
    name: browser tests (${{ matrix.engine }})
    needs: [playwright-version, engine]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One job per browser engine, so the slow WebKit projects run beside the others.
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            projects: --project=light --project=dark --project=phone
          - engine: firefox
            projects: --project=firefox
          - engine: webkit
            projects: --project=safari --project=iphone
    # The browsers and their system libraries come with the image, so the job needs
    # no apt or browser download. The tag comes from package.json, so no digest can
    # be pinned next to it. The site self-hosts its fonts (@fontsource), so the
    # image needs no extra system font.
    container:
      # jactionlint ignore=unpinned-images
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    # Firefox expects HOME to be the root user's home inside the container.
    env:
      HOME: /root
    # Container jobs default to sh, which has no pipefail.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # The shipped-data test reads the embodied flows by range request, as the
      # live page does.
      - uses: ./.github/actions/data

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-pkg
          path: engine
      - run: pnpm build
      - run: pnpm exec playwright test ${{ matrix.projects }}
      # a failure keeps its trace (DOM, console, timing), for failures only CI shows
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.engine }}
          path: test-results/
          retention-days: 7

  # The ruleset requires this name; it passes only when every engine passed.
  browser-all:
    name: browser and accessibility tests
    needs: browser
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every engine passed
        env:
          RESULT: ${{ needs.browser.result }}
        run: test "$RESULT" = success

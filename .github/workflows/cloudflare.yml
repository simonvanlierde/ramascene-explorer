name: cloudflare

# Production deploys from main; each pull request from this repository uploads a
# version with a preview alias, served on workers.dev (docs/publishing.md#cloudflare).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # one production deploy at a time; a newer push to a pull request replaces its upload
  group: cloudflare-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    # Forks get no secrets, so their pull requests get no preview. Run workflow offers
    # every branch; only main publishes production.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    environment:
      name: cloudflare
      url: ${{ steps.publish.outputs.url }}
    runs-on: ubuntu-latest
    # the threaded kernel builds std from source on a pinned nightly, with no cache
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The page shows a banner over synthetic data, but it must never go out at
      # all: only output that passed precompute.py's checks is marked exiobase-v3.
      - name: check the data
        run: |
          set -euo pipefail
          test -f data/results.json || { echo "data/results.json is missing: run precompute.py first"; exit 1; }
          jq -e '.data_kind == "exiobase-v3"' data/results.json >/dev/null \
            || { echo "data/results.json is not exiobase-v3 output"; exit 1; }

      # The embodied flows are too large for git and live on a release instead.
      # The checksum pins the exact file this commit was built against.
      - name: fetch the embodied flows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download data-2011-r2 --repo "$GITHUB_REPOSITORY" --pattern embodied.parquet --dir data
          sha256sum --check data/embodied.sha256
          gh release download data-2011 --repo "$GITHUB_REPOSITORY" --pattern ramascene-browser-engine-zarr.tar --dir data
          sha256sum --check data/browser-engine-zarr.sha256
          tar -xf data/ramascene-browser-engine-zarr.tar -C data

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # The build copies results.json, the embodied flows and the map geometry into site/,
      # and leaves out the synthetic fixture.
      - run: pnpm install --frozen-lockfile
      # No cache: this job holds the deploy token, and a poisoned cache must not reach it.
      - uses: ./.github/actions/engine
        with:
          cache: "false"
      - run: pnpm build:cloudflare

      - name: publish
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Set the CLOUDFLARE_API_TOKEN secret on the cloudflare environment"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Set the CLOUDFLARE_ACCOUNT_ID repository variable"; exit 1; }
          key=$(node -p '"embodied/" + require("./data/results.json").provenance.embodied.sha256 + ".parquet"')
          pnpm exec wrangler r2 object put "ramascene-explorer-data/$key" --file data/embodied.parquet --remote
          if [ "$EVENT" = pull_request ]; then
            # previews stay out of search results; each version keeps its own _headers
            printf '\n/*\n  X-Robots-Tag: noindex\n' >> site/_headers
            pnpm exec wrangler versions upload --preview-alias "pr-$PR" | tee "$RUNNER_TEMP/upload.log"
            url=$(grep -oE "https://pr-$PR-[a-z0-9.-]+\.workers\.dev" "$RUNNER_TEMP/upload.log" | head -1)
            test -n "$url" || { echo "No preview URL in the upload output"; exit 1; }
            echo "url=$url/ramascene-explorer/" >> "$GITHUB_OUTPUT"
          else
            pnpm exec wrangler deploy
            echo "url=https://simonvanlierde.com/ramascene-explorer/" >> "$GITHUB_OUTPUT"
          fi

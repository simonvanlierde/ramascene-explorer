name: cloudflare

# Production deploys from main; each pull request from this repository uploads a
# version with a preview alias, served on workers.dev (docs/publishing.md#cloudflare).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # one production deploy at a time; a newer push to a pull request replaces its upload
  group: cloudflare-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Installs dependencies and runs the build, which executes repository code, so this job has
  # no environment and no secrets. The upload job gets only its output.
  build:
    name: build
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # the threaded kernel builds std from source on a pinned nightly, with no cache
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The page shows a banner over synthetic data, but it must never go out at
      # all: only output that passed pipeline/precompute.py's checks is marked exiobase-v3.
      - name: check the data
        run: |
          set -euo pipefail
          test -f data/results.json || { echo "data/results.json is missing: run pipeline/precompute.py first"; exit 1; }
          jq -e '.data_kind == "exiobase-v3"' data/results.json >/dev/null \
            || { echo "data/results.json is not exiobase-v3 output"; exit 1; }

      # The embodied flows are too large for git and live on a release instead.
      # The checksum pins the exact file this commit was built against.
      - name: fetch the embodied flows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download data-2011-r2 --repo "$GITHUB_REPOSITORY" --pattern embodied.parquet --dir data
          sha256sum --check data/embodied.sha256
          gh release download data-2011 --repo "$GITHUB_REPOSITORY" --pattern ramascene-browser-engine-zarr.tar --dir data
          sha256sum --check data/browser-engine-zarr.sha256
          tar -xf data/ramascene-browser-engine-zarr.tar -C data

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # The build copies results.json, the embodied flows and the map geometry into site/,
      # and leaves out the synthetic fixture.
      - run: pnpm install --frozen-lockfile
      # No cache: a cache a pull request poisoned must not reach the production build.
      - uses: ./.github/actions/engine
        with:
          cache: "false"
      # With the DATA_ORIGIN variable set, the page reads the Parquet and the store from that
      # host (R2 on its own hostname) instead of through the Worker (docs/publishing.md#data-host).
      - run: pnpm build:cloudflare
        env:
          VITE_DATA_ORIGIN: ${{ vars.DATA_ORIGIN }}

      # include-hidden-files: site/ holds _headers and .assetsignore, which the upload skips by
      # default. The data/ paths are what the upload job puts on R2.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: |
            site
            data/embodied.parquet
            data/results.json
            data/browser-engine
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Every run uploads a version without serving it; check tests that version, and only
  # then does promote put it on the production routes.
  upload:
    name: ${{ github.event_name == 'pull_request' && 'preview' || 'upload' }}
    # Forks get no secrets, so their pull requests get no preview. Run workflow offers
    # every branch; only main publishes production.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    needs: build
    environment:
      name: cloudflare
      url: ${{ steps.publish.outputs.url }}
    outputs:
      url: ${{ steps.publish.outputs.url }}
      version: ${{ steps.publish.outputs.version }}
      playwright: ${{ steps.playwright.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # check's browser image must match the Playwright in package.json
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      # Only wrangler runs here. --ignore-scripts keeps lifecycle scripts out of this job; the
      # lockfile fixes every version and hash, so this is the wrangler the other jobs resolve.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: publish
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Set the CLOUDFLARE_API_TOKEN secret on the cloudflare environment"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Set the CLOUDFLARE_ACCOUNT_ID repository variable"; exit 1; }
          # The key is the file's own hash: a results.json from another run must not
          # overwrite an immutable object under its name.
          sha=$(sha256sum data/embodied.parquet | cut -d' ' -f1)
          test "$sha" = "$(node -p 'require("./data/results.json").provenance.embodied.sha256')" \
            || { echo "data/results.json names other embodied flows than data/embodied.parquet"; exit 1; }
          key="embodied/$sha.parquet"
          immutable="public, max-age=31536000, immutable"
          pnpm exec wrangler r2 object put "ramascene-explorer-data/$key" --file data/embodied.parquet --remote \
            --cache-control "$immutable" --content-type application/vnd.apache.parquet
          # The store's keys carry its hash too. The marker goes up last, so a store is only
          # skipped once every shard is in.
          store="store-$(jq -r .store data/browser-engine/manifest-v3.json)"
          marker="ramascene-explorer-data/browser-engine/$store/.complete"
          if ! pnpm exec wrangler r2 object get "$marker" --remote --pipe > /dev/null 2>&1; then
            (cd data/browser-engine && find "$store" -type f) | xargs -P 8 -I{} \
              pnpm exec wrangler r2 object put "ramascene-explorer-data/browser-engine/{}" \
              --file "data/browser-engine/{}" --remote --cache-control "$immutable" \
              --content-type application/octet-stream > /dev/null
            printf '%s\n' "$store" | pnpm exec wrangler r2 object put "$marker" --pipe --remote
          fi
          if [ "$EVENT" = pull_request ]; then
            # previews stay out of search results; each version keeps its own _headers
            printf '\n/*\n  X-Robots-Tag: noindex\n' >> site/_headers
            pnpm exec wrangler versions upload --preview-alias "pr-$PR" | tee "$RUNNER_TEMP/upload.log"
            url=$(grep -oE "https://pr-$PR-[a-z0-9.-]+\.workers\.dev" "$RUNNER_TEMP/upload.log" | head -1)
          else
            pnpm exec wrangler versions upload | tee "$RUNNER_TEMP/upload.log"
            url=$(grep -oE "https://[a-z0-9]+-ramascene-explorer\.[a-z0-9.-]+\.workers\.dev" "$RUNNER_TEMP/upload.log" | head -1)
          fi
          version=$(grep -oiE "Worker Version ID: [0-9a-f-]{36}" "$RUNNER_TEMP/upload.log" | grep -oE "[0-9a-f-]{36}$")
          test -n "$url" || { echo "No preview URL in the upload output"; exit 1; }
          test -n "$version" || { echo "No version ID in the upload output"; exit 1; }
          { echo "url=$url/ramascene-explorer/"; echo "version=$version"; } >> "$GITHUB_OUTPUT"

  check:
    name: check ${{ github.event_name == 'pull_request' && 'preview' || 'upload' }}
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The same browser image as ci.yml's browser job; this job gets no token.
    container:
      # jactionlint ignore=unpinned-images
      image: mcr.microsoft.com/playwright:v${{ needs.upload.outputs.playwright }}-noble
    env:
      HOME: /root
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - run: pnpm install --frozen-lockfile
      - name: ranges, isolation and a browser calculation on the uploaded version
        env:
          URL: ${{ needs.upload.outputs.url }}
          # previews check one engine; main checks all three before promote
          CHECK_BROWSERS: ${{ github.event_name == 'pull_request' && 'chromium' || 'chromium,firefox,webkit' }}
          DATA_ORIGIN: ${{ vars.DATA_ORIGIN }}
        run: node hosting/check.js "$URL"

  promote:
    name: production
    needs: [upload, check]
    if: github.event_name != 'pull_request'
    environment:
      name: cloudflare
      url: https://simonvanlierde.com/ramascene-explorer/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      # The deploy token is in scope here: only wrangler runs, so no install scripts.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: serve the checked version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ needs.upload.outputs.version }}
        run: |
          set -euo pipefail
          pnpm exec wrangler versions deploy "$VERSION@100%" --yes
          # versions deploy leaves the routes alone; this applies wrangler.jsonc's.
          # It uploads no assets but refuses a missing assets.directory, and this job
          # builds none.
          mkdir -p site
          pnpm exec wrangler triggers deploy

name: cloudflare

# Production deploys from main. Each ready pull request from this repository gets its own
# preview Worker, which preview-retire.yml deletes (docs/publishing.md#cloudflare).
on:
  push:
    branches: [main]
  pull_request:
    # the default types plus ready_for_review: a draft gets no preview, so marking it ready
    # is what starts one
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # one production deploy at a time; a newer push to a pull request replaces its upload
  group: cloudflare-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On main, uploads a version without serving it; check tests that version, and only then
  # does promote put it on the production routes. On a pull request, deploys the preview
  # Worker that check tests.
  upload:
    name: ${{ github.event_name == 'pull_request' && 'preview' || 'upload' }}
    # Forks get no secrets, so their pull requests get no preview. Nor do drafts, or bot
    # pull requests (Renovate, Dependabot), so their code never runs with the token.
    # Run workflow offers every branch; only main publishes production.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        && !github.event.pull_request.draft && !endsWith(github.event.pull_request.user.login, '[bot]'))
      || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    # shares preview-retire.yml's group, so a retire waits for a deploy in flight
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('preview-{0}', github.event.pull_request.number) || 'upload' }}
    permissions:
      contents: read
      pull-requests: read # to re-read the pull request's state before the deploy
    environment:
      name: cloudflare
      url: ${{ steps.publish.outputs.url }}
    outputs:
      url: ${{ steps.publish.outputs.url }}
      version: ${{ steps.publish.outputs.version }}
      playwright: ${{ steps.playwright.outputs.version }}
    runs-on: ubuntu-latest
    # the threaded kernel builds std from source on a pinned nightly, with no cache
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # check's browser image must match the Playwright in package.json
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      # The page shows a banner over synthetic data, but it must never go out at
      # all: only output that passed pipeline/precompute.py's checks is marked exiobase-v3.
      - name: check the data
        run: |
          set -euo pipefail
          test -f data/results.json || { echo "data/results.json is missing: run pipeline/precompute.py first"; exit 1; }
          jq -e '.data_kind == "exiobase-v3"' data/results.json >/dev/null \
            || { echo "data/results.json is not exiobase-v3 output"; exit 1; }
          test "$(jq -r .provenance.embodied.sha256 data/results.json)" = "$(cut -d' ' -f1 data/embodied.sha256)" \
            || { echo "data/results.json names other embodied flows than data/embodied.sha256"; exit 1; }

      # The store ships with the page, and its manifest names the store the page reads. It is
      # too large for git and lives on a release; the checksum pins the exact file.
      - name: fetch the browser store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download data-2011 --repo "$GITHUB_REPOSITORY" --pattern ramascene-browser-engine-zarr.tar --dir data
          sha256sum --check data/browser-engine-zarr.sha256
          tar -xf data/ramascene-browser-engine-zarr.tar -C data

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # The build copies results.json, the store and the map geometry into site/,
      # and leaves out the synthetic fixture.
      - run: pnpm install --frozen-lockfile
      # No cache: this job holds the deploy token, and a poisoned cache must not reach it.
      - uses: ./.github/actions/engine
        with:
          cache: "false"
      # With the DATA_ORIGIN variable set, the page reads the Parquet and the store from that
      # host (R2 on its own hostname) instead of through the Worker (docs/publishing.md#data-host).
      - run: pnpm build:cloudflare
        env:
          VITE_DATA_ORIGIN: ${{ vars.DATA_ORIGIN }}

      # This workflow never writes to R2; data.yml publishes a data release there. The Worker
      # and the data host both read the bucket, so the data must be in before anything serves
      # this build. The query string skips an edge copy of a 404 from before the upload.
      - name: check the data is published
        env:
          DATA_ORIGIN: ${{ vars.DATA_ORIGIN }}
        run: |
          set -euo pipefail
          test -n "$DATA_ORIGIN" || { echo "Set the DATA_ORIGIN repository variable: the published data is checked there"; exit 1; }
          store="store-$(jq -r .store data/browser-engine/manifest-v3.json)"
          [[ $store =~ ^store-[0-9a-f]{64}$ ]] || { echo "The manifest names no valid store: $store"; exit 1; }
          for key in "embodied/$(cut -d' ' -f1 data/embodied.sha256).parquet" "browser-engine/$store/.complete"; do
            code=$(curl -sS -o /dev/null -I -w '%{http_code}' "${DATA_ORIGIN%/}/$key?run=$GITHUB_RUN_ID" || true)
            if [ "$code" != 200 ]; then
              echo "::error::${DATA_ORIGIN%/}/$key answers HTTP $code: the data for this commit is not published: publish its data release first (data.yml)"
              exit 1
            fi
          done

      - name: publish
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Set the CLOUDFLARE_API_TOKEN secret on the cloudflare environment"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Set the CLOUDFLARE_ACCOUNT_ID repository variable"; exit 1; }
          if [ "$EVENT" = pull_request ]; then
            # The event may be minutes old. Read the pull request now, so a late deploy cannot
            # bring back the preview of one that has closed or turned draft since.
            state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.state + " " + (.draft|tostring)')
            if [ "$state" != "open false" ]; then
              echo "::notice::Preview skipped: pull request $PR is no longer open and ready ($state)."
              exit 0
            fi
            # previews stay out of search results
            printf '\n/*\n  X-Robots-Tag: noindex\n' >> site/_headers
            pnpm exec wrangler deploy --config wrangler.preview.jsonc --name "ramascene-explorer-pr-$PR" \
              --message "PR $PR at $SHA" | tee "$RUNNER_TEMP/upload.log"
            url=$(grep -oE "https://ramascene-explorer-pr-$PR\.[a-z0-9.-]+\.workers\.dev" "$RUNNER_TEMP/upload.log" | head -1)
            test -n "$url" || { echo "Deployed, but wrangler printed no workers.dev address: check wrangler.preview.jsonc"; exit 1; }
            echo "### Preview: $url/ramascene-explorer/" >> "$GITHUB_STEP_SUMMARY"
          else
            pnpm exec wrangler versions upload | tee "$RUNNER_TEMP/upload.log"
            url=$(grep -oE "https://[a-z0-9]+-ramascene-explorer\.[a-z0-9.-]+\.workers\.dev" "$RUNNER_TEMP/upload.log" | head -1)
            version=$(grep -oiE "Worker Version ID: [0-9a-f-]{36}" "$RUNNER_TEMP/upload.log" | grep -oE "[0-9a-f-]{36}$")
            test -n "$url" || { echo "No preview URL in the upload output"; exit 1; }
            test -n "$version" || { echo "No version ID in the upload output"; exit 1; }
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
          echo "url=$url/ramascene-explorer/" >> "$GITHUB_OUTPUT"

  check:
    name: check ${{ github.event_name == 'pull_request' && 'preview' || 'upload' }}
    needs: upload
    # no URL: the pull request closed or turned draft before its preview went up
    if: needs.upload.outputs.url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The same browser image as ci.yml's browser job; this job gets no token.
    container:
      # jactionlint ignore=unpinned-images
      image: mcr.microsoft.com/playwright:v${{ needs.upload.outputs.playwright }}-noble
    env:
      HOME: /root
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - run: pnpm install --frozen-lockfile
      - name: ranges, isolation and a browser calculation on the uploaded version
        env:
          URL: ${{ needs.upload.outputs.url }}
          # previews check one engine; main checks all three before promote
          CHECK_BROWSERS: ${{ github.event_name == 'pull_request' && 'chromium' || 'chromium,firefox,webkit' }}
          DATA_ORIGIN: ${{ vars.DATA_ORIGIN }}
        run: node hosting/check.js "$URL"

  promote:
    name: production
    needs: [upload, check]
    if: github.event_name != 'pull_request'
    environment:
      name: cloudflare
      url: https://simonvanlierde.com/ramascene-explorer/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      # The deploy token is in scope here: no install scripts and no .pnpmfile.cjs.
      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: serve the checked version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ needs.upload.outputs.version }}
        run: |
          set -euo pipefail
          pnpm exec wrangler versions deploy "$VERSION@100%" --yes
          # versions deploy leaves the routes alone; this applies wrangler.jsonc's.
          # It uploads no assets but refuses a missing assets.directory, and this job
          # builds none.
          mkdir -p site
          pnpm exec wrangler triggers deploy

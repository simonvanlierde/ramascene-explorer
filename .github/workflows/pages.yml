name: pages

# Manual only: nothing publishes on push. Builds the page with Vite and ships
# dist/: the bundled page and fonts, the map geometry and the four data files.
# Refuses to ship without real precompute output.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The page shows a banner over synthetic data, but it must never go out at
      # all: only output that passed precompute.py's checks is marked exiobase-v3.
      - name: check the data
        run: |
          set -euo pipefail
          test -f data/results.json || { echo "data/results.json is missing: run precompute.py first"; exit 1; }
          jq -e '.data_kind == "exiobase-v3"' data/results.json >/dev/null \
            || { echo "data/results.json is not exiobase-v3 output"; exit 1; }

      # The embodied flows are too large for git and live on a release instead.
      # The checksum pins the exact file this commit was built against.
      - name: fetch the embodied flows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download data-2011 --repo "$GITHUB_REPOSITORY" --pattern embodied.parquet --dir data
          echo "806ca8addc662ea608fb4e5c834b5f1432eb0fe51108435958061fa262fd027e  data/embodied.parquet" | sha256sum --check

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # The build copies results.json, the embodied flows and the map geometry into dist/,
      # and leaves out the synthetic fixture.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Job-level permissions replace the workflow-level grant.
    permissions:
      pages: write # publish the artifact to Pages
      id-token: write # deploy-pages proves the run's identity over OIDC
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

# Same policy as the project template: weekly, grouped, and a one-week cooldown
# so a compromised release is usually yanked before it lands. Security updates
# skip the cooldown. package.json has no dependencies, so no npm entry.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: pre-commit
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      hooks: { patterns: ["*"] }

  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7, semver-major-days: 30 }
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
        patterns: ["*"]

name: build the wasm kernel
description: Installs Rust and wasm-bindgen, then builds engine/ into engine/pkg.
inputs:
  cache:
    description: Restore and save the Cargo cache; off for releases.
    default: "true"
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: stable
        targets: wasm32-unknown-unknown
    - if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: engine
        save-if: ${{ github.event_name != 'pull_request' }}
    # wasm-bindgen-cli must be the exact version of the wasm-bindgen crate in Cargo.lock.
    - id: bindgen
      shell: bash
      run: echo "version=$(cargo pkgid --locked --manifest-path engine/Cargo.toml wasm-bindgen | sed 's/.*@//')" >> "$GITHUB_OUTPUT"
    - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
      with:
        tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
        fallback: none
    - shell: bash
      run: engine/build.sh

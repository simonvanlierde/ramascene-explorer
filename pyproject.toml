[project]
name = "ramascene-explorer"
version = "0.3.1"
description = "Precomputed RaMa-Scene scenario results and a static page to explore them"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=2", "django>=5.2,<6", "scipy>=1.15"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]
precompute = [
    "pyarrow>=26.0.0",
]

[tool.uv]
package = false
# Resolve no release younger than 7 days, as Renovate already waits, so a lock refresh or a
# manual `uv add` cannot pull a release published hours ago.
exclude-newer = "7 days"
# pyarrow writes data/embodied.parquet; the tests read it back
default-groups = ["dev", "precompute"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.report]
# Applies when pytest runs with --cov, as CI does.
fail_under = 80

[tool.ty.analysis]
# RaMa-Scene is a checkout passed with --engine, not an installed dependency.
allowed-unresolved-imports = ["ramascene", "ramascene.**"]

[tool.ty.src]
# Its own uv project, with the Brightway packages this environment lacks.
exclude = ["brightway-check"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # conflicts with the formatter
  "ANN",     # ty checks the types; annotating every matrix argument adds little
  "N802", "N803", "N806",  # A, L, Y, B are the input-output notation
  "RUF001", "RUF002",  # × and − are deliberate in strings and docstrings
  "EM", "TRY003",  # messages built inline at the raise
  "PLR0913", "PLR0917",  # the engine calls take Y, B, L and friends positionally
  "T201",  # precompute.py is a command-line script
  "CPY001",
  "D102", "D103", "D107",  # helpers are named for what they return; docstrings where the contract is not obvious
]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
# The engine imports only work after setup_django() has configured Django.
# compute() runs the checks in order and refuses at the first failure; tolerances
# are written where they are compared; git and the worker run with fixed argv.
"precompute.py" = ["PLC0415", "C901", "PLR0912", "PLR0915", "PLR2004", "FBT002", "S603", "S607"]
"compare_data.py" = ["C901"]
# The fake engine mirrors the real adapter's signatures and knobs.
"tests/**" = ["S101", "D1", "INP001", "PLR2004", "FBT", "PLC0415", "ARG001", "C901", "PT018", "S603", "S607", "ARG002", "ARG005", "S108"]
"conftest.py" = ["D1", "INP001"]

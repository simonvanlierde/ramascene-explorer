[project]
name = "ramascene-explorer"
version = "0.8.0"
description = "Explore consumption footprints and calculate scenarios using EXIOBASE 2011"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=2", "django>=5.2,<6", "scipy>=1.15"]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]
precompute = [
    "pyarrow>=26.0.0",
    "zarr>=3.4.1",
]

[tool.uv]
package = false
# Resolve no release younger than 7 days, as Renovate already waits, so a lock refresh or a
# manual `uv add` cannot pull a release published hours ago.
exclude-newer = "7 days"
# pyarrow writes data/embodied.parquet; the tests read it back
default-groups = ["dev", "precompute"]

# pytest 9's native table. strict turns unknown config keys, unknown markers and an
# xfail test that passes into errors; filterwarnings turns warnings into failures, so a
# deprecation shows up in CI, not after the upgrade that removes it.
[tool.pytest]
minversion = "9"
pythonpath = [".", "pipeline"]
testpaths = ["tests"]
addopts = ["-ra"]
strict = true
filterwarnings = ["error"]
log_level = "INFO"

[tool.coverage.report]
# Applies when pytest runs with --cov, as CI does.
fail_under = 80

[tool.ty.analysis]
# RaMa-Scene is a checkout passed with --engine, not an installed dependency.
allowed-unresolved-imports = ["ramascene", "ramascene.**"]

[tool.ty.environment]
extra-paths = ["pipeline"]

[tool.ty.src]
# Its own uv project, with the Brightway packages this environment lacks.
exclude = ["brightway-check"]

# No target-version: ruff reads it from requires-python.
[tool.ruff]
line-length = 120
# the pipeline modules are imported by bare name, so they sort as first-party
src = [".", "pipeline"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # conflicts with the formatter
  "ANN",     # ty checks the types; annotating every matrix argument adds little
  "N802", "N803", "N806",  # A, L, Y, B are the input-output notation
  "RUF001", "RUF002",  # × and − are deliberate in strings and docstrings
  "EM", "TRY003",  # messages built inline at the raise
  "PLR0913", "PLR0917",  # the engine calls take Y, B, L and friends positionally
  "T201",  # precompute.py is a command-line script
  "CPY001",
  "D102", "D103", "D107",  # helpers are named for what they return; docstrings where the contract is not obvious
]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
# The engine imports only work after setup_django() has configured Django.
# compute() runs the checks in order and refuses at the first failure; tolerances
# are written where they are compared; git and the worker run with fixed argv.
"pipeline/*.py" = ["INP001"]
"pipeline/precompute.py" = ["PLC0415", "C901", "PLR0912", "PLR0915", "PLR2004", "FBT002", "S603", "S607"]
"pipeline/compare_data.py" = ["C901"]
# The fake engine mirrors the real adapter's signatures and knobs.
"tests/**" = ["S101", "D1", "INP001", "PLR2004", "FBT", "PLC0415", "ARG001", "C901", "PT018", "S603", "S607", "ARG002", "ARG005", "S108"]
"tests/conftest.py" = ["D1", "INP001"]

# Scientific Python repo-review checks this project skips on purpose. The
# sp-repo-review git hook runs the rest.
[tool.repo-review.ignore]
PY007 = "just is the task runner: the justfile's recipes are what CI runs"
PP002 = "not a package: [tool.uv] package = false, the pipeline runs from pipeline/ as scripts"
PP003 = "no build-system table, so no wheel build dependency either"
GH200 = "Renovate updates the actions and hook revs (renovate.json5)"
PC140 = "ty runs as a local hook from the synced venv, and in ci.yml"
PC160 = "no spell checker hook yet"
PC170 = "no reStructuredText: the docs are Markdown"
PC180 = "no Markdown formatter hook: the docs are wrapped by hand"
PC901 = "the hooks run in hygiene.yml through prek, not on pre-commit.ci"
PC902 = "the hooks run in hygiene.yml through prek, not on pre-commit.ci"
PC903 = "the hooks run in hygiene.yml through prek, not on pre-commit.ci"

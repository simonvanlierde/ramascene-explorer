# Run with prek: prek install && prek run -a. CI runs the same hooks
# (.github/workflows/hygiene.yml); Renovate keeps the revs current.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]  # pnpm 12 writes its own pin as a first document in pnpm-lock.yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
        exclude: ^fonts/OFL\.txt$  # the licence text stays byte-for-byte as issued

  # Rules in pyproject.toml [tool.ruff]. Keep rev in step with ruff in uv.lock.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
      - id: ruff-format

  # ty needs the project's .venv to resolve numpy, so it runs through uv.
  # CI runs it in ci.yml, where the environment is synced; hygiene.yml skips it.
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run --frozen ty check
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/betterleaks/betterleaks
    rev: 81aff7a638638aae3a659845d089043e1d8fe9ac # frozen: v1.9.0
    hooks:
      - id: betterleaks

  # Static analysis of .github/: template injection, credential leakage, cache
  # poisoning, impostor commits behind a pinned digest. Set GH_TOKEN to enable
  # the audits that need the API; the offline subset runs without it.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

  # What zizmor doesn't check: unknown keys, bad `needs`, type errors in
  # expressions, and shellcheck over every `run:` when shellcheck is on PATH.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-citation-file-format

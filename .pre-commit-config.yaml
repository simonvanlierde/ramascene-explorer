# Run with prek: prek install && prek run -a. CI runs the same hooks
# (.github/workflows/hygiene.yml); Dependabot keeps the revs current.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Static analysis of .github/: template injection, credential leakage, cache
  # poisoning, impostor commits behind a pinned digest. Set GH_TOKEN to enable
  # the audits that need the API; the offline subset runs without it.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.28.0
    hooks:
      - id: zizmor

  # What zizmor doesn't check: unknown keys, bad `needs`, type errors in
  # expressions, and shellcheck over every `run:` when shellcheck is on PATH.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-citation-file-format

# Run with prek: prek install && prek run -a. CI runs the same hooks
# (.github/workflows/hygiene.yml); Renovate keeps the revs current.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]  # pnpm 12 writes its own pin as a first document in pnpm-lock.yaml
      - id: end-of-file-fixer
        exclude: ^tests/fixture-store/  # zarr-python's output, byte for byte
      - id: mixed-line-ending
      - id: trailing-whitespace

  # A copier update that cannot merge a file leaves conflict markers or a .rej file: neither may reach main.
  - repo: local
    hooks:
      - id: copier-update-conflict
        name: a copier update left conflict markers
        # \r? for a CRLF file, where Copier writes CRLF markers. A .rej file is the other hook's.
        entry: '^(<<<<<<< before updating|>>>>>>> after updating)\r?$'
        language: pygrep
        types: [text]
        exclude: '\.rej$'
      - id: copier-update-rej
        name: a copier update left a .rej file (resolve its hunks in the file next to it, then delete it)
        entry: delete this file once its hunks are resolved
        language: fail
        files: '\.rej$'

  # .json files are read as JSON5, so comments and trailing commas pass;
  # syntax errors and duplicate keys fail.
  - repo: https://github.com/simonvanlierde/jsonvet
    rev: 022d320d5b971eccb28cfa6ce205152cbb382e53  # frozen: v3.2.0
    hooks:
      - id: jsonvet

  # Rules in pyproject.toml [tool.ruff]. Keep rev in step with ruff in uv.lock.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
      - id: ruff-format

  # ty needs the project's .venv to resolve numpy, so it runs through uv.
  # CI runs it in ci.yml, where the environment is synced; hygiene.yml skips it.
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run --frozen ty check
        language: system
        types: [python]
        pass_filenames: false

  # The JavaScript lint and format, as ci.yml's `biome ci` runs it. Runs from the
  # project's node_modules, so hygiene.yml, which installs none, skips it.
  - repo: local
    hooks:
      - id: biome
        name: biome check
        entry: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        types_or: [javascript, json]

  # Scientific Python's repo-review; pyproject.toml [tool.repo-review.ignore] lists
  # the checks skipped on purpose.
  - repo: https://github.com/scientific-python/cookie
    rev: 1589a99867d6cac494ac7545fe6a83108580a3ee # frozen: 2026.08.14
    hooks:
      - id: sp-repo-review
        # Upstream leaves repo-review unpinned.
        additional_dependencies: ["repo-review[cli]==1.3.0"]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/betterleaks/betterleaks
    rev: 81aff7a638638aae3a659845d089043e1d8fe9ac # frozen: v1.9.0
    hooks:
      - id: betterleaks

  # Static analysis of .github/: template injection, credential leakage, cache
  # poisoning, impostor commits behind a pinned digest. Set GH_TOKEN to enable
  # the audits that need the API; the offline subset runs without it.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor

  # What zizmor doesn't check: unknown keys, bad `needs`, type errors in
  # expressions, and shellcheck over every `run:` when shellcheck is on PATH.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-citation-file-format

  # The citation files and package manifests must agree (CITATION.cff is the source).
  - repo: https://github.com/simonvanlierde/citesync
    rev: fcf820dd16ac5e5605ea78e4dd4398ff995b20ec
    hooks:
      - id: citesync

# Direction contract (chosen 2026-10-18, round 3 "synth", softened)

Goes verbatim as the first child of `<body>` in index.html at build time (an HTML comment).

THESIS: a map-first explorer that answers one consumption question in a live sentence, then lets you take it apart by industry; refuses the dark glowing-globe demo and the KPI-card dashboard.
OWN-WORLD: slate ink #1f2a33 on #f4f5f5, white 8px cards with hairlines, rust flow bands #a8471c, sand→teal fill ramp, 15 muted section hues shared by rail, map and Sankey; Spectral sentence, Public Sans everything else.
STORY: see where a country's consumption releases its emissions, filter industries, then ask what one intervention changes; trust it from the basis line and Verified pill.
FIRST VIEWPORT: sidebar (mode, country, direction, indicator, stepped industry rail); live sentence over a three-number strip; map card with tapered bands, Flat/Globe, legend; Details opens the Sankey/Table slide-over.
FORM: synthesis of canon (layout), SPM (look, rail, scrubber) and atlas (bands); roll key 2667b56a.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
